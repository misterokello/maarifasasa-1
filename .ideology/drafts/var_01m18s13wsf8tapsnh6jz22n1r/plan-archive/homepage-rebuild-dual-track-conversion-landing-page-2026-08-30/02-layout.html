<svg viewBox="0 0 640 470" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans); width: 100%; height: auto;">
  <style>
    .lbl { fill: hsl(var(--foreground)); font-size: 14px; font-weight: 480; }
    .note { fill: hsl(var(--muted-foreground)); font-size: 12px; }
    .bx { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .zn { fill: none; stroke: hsl(var(--border)); stroke-width: 1; stroke-dasharray: 4 3; }
    .gr { fill: hsl(var(--border)); }
    .qf { fill: hsl(var(--muted)); }
    .ac { fill: hsl(var(--accent)); }
    .acs { fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
    .acl { fill: hsl(var(--accent-foreground)); font-size: 12px; }
  </style>

  <!-- Hero -->
  <rect class="bx" x="16" y="14" width="380" height="82" rx="8"/>
  <text class="lbl" x="30" y="38">Hero — mission + dual CTA</text>
  <rect class="gr" x="30" y="48" width="240" height="7" rx="3.5"/>
  <rect class="gr" x="30" y="60" width="190" height="7" rx="3.5"/>
  <rect class="ac" x="30" y="76" width="96" height="14" rx="7"/>
  <rect class="qf" x="134" y="76" width="96" height="14" rx="7"/>
  <rect class="qf" x="406" y="14" width="218" height="82" rx="8"/>
  <text class="note" x="418" y="60">hero image + stat chips</text>

  <!-- Dual track -->
  <rect class="acs" x="16" y="108" width="298" height="58" rx="8"/>
  <text class="lbl" x="30" y="132">I want to learn &amp; earn</text>
  <rect class="gr" x="30" y="142" width="170" height="7" rx="3.5"/>
  <rect class="bx" x="326" y="108" width="298" height="58" rx="8"/>
  <text class="lbl" x="340" y="132">I'm hiring or partnering</text>
  <rect class="gr" x="340" y="142" width="170" height="7" rx="3.5"/>

  <!-- Proof band -->
  <rect class="qf" x="16" y="178" width="608" height="42" rx="8"/>
  <text class="lbl" x="40" y="197">10,000+</text><text class="note" x="40" y="212">trained</text>
  <text class="lbl" x="180" y="197">~2,000</text><text class="note" x="180" y="212">placements</text>
  <text class="lbl" x="320" y="197">UGX 1.2B</text><text class="note" x="320" y="212">earned yearly</text>
  <text class="lbl" x="470" y="197">95%</text><text class="note" x="470" y="212">completion</text>

  <!-- Pathway stepper -->
  <rect class="zn" x="16" y="232" width="608" height="60" rx="8"/>
  <text class="note" x="26" y="248">pathway stepper</text>
  <rect class="bx" x="34" y="254" width="170" height="28" rx="8"/><text class="note" x="46" y="272">01 Build the skills</text>
  <rect class="bx" x="234" y="254" width="170" height="28" rx="8"/><text class="note" x="246" y="272">02 Convert to work</text>
  <rect class="bx" x="434" y="254" width="170" height="28" rx="8"/><text class="note" x="446" y="272">03 Sustain &amp; belong</text>
  <line x1="204" y1="268" x2="230" y2="268" stroke="hsl(var(--muted-foreground))" stroke-width="1" marker-end="url(#cv)"/>
  <line x1="404" y1="268" x2="430" y2="268" stroke="hsl(var(--muted-foreground))" stroke-width="1" marker-end="url(#cv)"/>

  <!-- Carousels -->
  <rect class="acs" x="16" y="304" width="608" height="76" rx="8"/>
  <text class="lbl" x="30" y="324">Featured courses carousel</text>
  <rect class="qf" x="30" y="334" width="130" height="36" rx="8"/>
  <rect class="qf" x="170" y="334" width="130" height="36" rx="8"/>
  <rect class="qf" x="310" y="334" width="130" height="36" rx="8"/>
  <rect class="qf" x="450" y="334" width="130" height="36" rx="8"/>
  <circle class="ac" cx="604" cy="352" r="11"/><text class="acl" x="600" y="356">1</text>

  <rect class="bx" x="16" y="390" width="298" height="34" rx="8"/>
  <text class="note" x="30" y="411">Upcoming cohorts carousel</text>
  <rect class="bx" x="326" y="390" width="298" height="34" rx="8"/>
  <text class="note" x="340" y="411">Stories carousel · skills grid · partners</text>

  <!-- Final CTA -->
  <rect class="qf" x="16" y="434" width="608" height="26" rx="8"/>
  <text class="note" x="30" y="451">Employer band · affiliate band · final CTA + sticky mobile bar</text>

  <text class="note" x="16" y="470" fill="hsl(var(--muted-foreground))">1 — live data from the products table, admin-managed, straight into /checkout</text>

  <defs>
    <marker id="cv" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1"/>
    </marker>
  </defs>
</svg>
